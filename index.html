<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>WWII Pixel Assault Online</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090b08;
    color:#eee;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

button,
input{
    font-family:inherit;
}

button{
    border:1px solid #79845e;
    background:#39452d;
    color:#fff;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#4c5c3a;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

input{
    width:100%;
    padding:13px;
    background:#11150f;
    border:1px solid #596449;
    border-radius:8px;
    color:white;
    font-size:18px;
    outline:none;
}

input:focus{
    border-color:#a7bb79;
}

#gameWrap{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#12140f;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:auto;
}

/* =========================
   ONLINE PANEL
========================= */

#onlinePanel{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            rgba(54,65,42,.85),
            rgba(4,6,4,.97)
        );
}

.panelBox{
    width:min(440px,92vw);
    padding:28px;
    border:1px solid #68744e;
    border-radius:16px;
    background:rgba(16,21,14,.96);
    box-shadow:0 20px 80px #000;
    text-align:center;
}

.title{
    font-size:32px;
    font-weight:bold;
    color:#e9d99c;
    margin-bottom:8px;
}

.subtitle{
    color:#aeb8a0;
    margin-bottom:24px;
}

.step{
    display:none;
}

.step.active{
    display:block;
}

.field{
    margin:12px 0;
}

.field label{
    display:block;
    text-align:right;
    margin-bottom:6px;
    color:#bfc9af;
}

.actionRow{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.actionRow button{
    flex:1;
}

.status{
    min-height:28px;
    margin-top:14px;
    color:#e6c978;
    line-height:1.6;
}

.roomCode{
    font-size:44px;
    letter-spacing:8px;
    color:#ffe19b;
    margin:12px 0 20px;
    direction:ltr;
}

.playersBox{
    text-align:right;
    background:#0b0e09;
    border:1px solid #3d4732;
    border-radius:10px;
    padding:14px;
    margin:14px 0;
    line-height:2;
}

.waiting{
    color:#aab59b;
    font-size:14px;
    margin:10px 0;
}

#startGameBtn{
    width:100%;
    margin-top:8px;
    background:#687c43;
    border-color:#9bae6c;
    font-size:19px;
}

#leaveRoomBtn{
    width:100%;
    margin-top:10px;
    background:#3d2925;
    border-color:#765047;
}

#onlineInfo{
    position:absolute;
    top:12px;
    right:12px;
    z-index:15;
    display:none;
    background:rgba(5,7,5,.8);
    border:1px solid #657052;
    border-radius:8px;
    padding:7px 12px;
    color:#d5dfc3;
    font-size:13px;
}

/* =========================
   GAME HUD
========================= */

#hud{
    position:absolute;
    left:12px;
    top:12px;
    z-index:10;
    pointer-events:none;
    direction:ltr;
}

.hudBox{
    background:rgba(8,10,7,.75);
    border:1px solid #566047;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:6px;
    font-size:14px;
}

.hpBar{
    width:170px;
    height:12px;
    background:#261713;
    border:1px solid #68453c;
    border-radius:5px;
    overflow:hidden;
}

#hpFill{
    width:100%;
    height:100%;
    background:#76934e;
}

#gameMessage{
    position:absolute;
    left:50%;
    top:13%;
    transform:translateX(-50%);
    z-index:12;
    color:#ffe49a;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
    display:none;
}

.mobileBtn{
    position:absolute;
    pointer-events:auto;
    width:62px;
    height:62px;
    border-radius:50%;
    background:rgba(35,45,28,.72);
    border:1px solid #7b8b5e;
    color:#fff;
    font-size:22px;
    user-select:none;
}

#btnLeft{
    left:22px;
    bottom:35px;
}

#btnRight{
    left:95px;
    bottom:35px;
}

#btnJump{
    right:100px;
    bottom:105px;
}

#btnShoot{
    right:22px;
    bottom:35px;
}

#btnReload{
    right:100px;
    bottom:35px;
}

#btnGrenade{
    right:175px;
    bottom:35px;
}

/* =========================
   MENU
========================= */

#gameMenu{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(4,6,4,.72);
}

.menuBox{
    width:min(380px,90vw);
    background:#121710;
    border:1px solid #667351;
    border-radius:14px;
    padding:25px;
    text-align:center;
}

.menuBox h2{
    color:#e8d595;
    margin-top:0;
}

.menuBox button{
    display:block;
    width:100%;
    margin:9px 0;
}

/* =========================
   LANDSCAPE PHONE
========================= */

@media(max-width:800px){

    .title{
        font-size:26px;
    }

    .panelBox{
        padding:20px;
    }

    #mobileControls{
        display:block;
    }

    #hud{
        transform:scale(.9);
        transform-origin:top left;
    }

    .roomCode{
        font-size:34px;
    }
}

</style>

</head>

<body>

<div id="gameWrap">

<canvas id="game"></canvas>

<div id="onlineInfo"></div>

<div id="hud">

    <div class="hudBox">
        ❤️ <span id="hpText">100</span>
        <div class="hpBar">
            <div id="hpFill"></div>
        </div>
    </div>

    <div class="hudBox">
        Stage: <span id="stageText">1</span>
    </div>

    <div class="hudBox">
        Weapon: <span id="weaponText">Rifle</span>
    </div>

    <div class="hudBox">
        Enemies: <span id="enemyText">0</span>
    </div>

</div>

<div id="gameMessage"></div>

<!-- =========================
     ONLINE LOGIN / LOBBY
========================= -->

<div id="onlinePanel">

    <div class="panelBox">

        <div class="title">
            WWII PIXEL ASSAULT
        </div>

        <div class="subtitle">
            Multiplayer Online
        </div>

        <!-- NAME -->

        <div id="nameStep" class="step active">

            <div class="field">
                <label>نام بازیکن</label>
                <input
                    id="nameInput"
                    maxlength="16"
                    placeholder="مثلاً Mahyar"
                    autocomplete="off"
                >
            </div>

            <button
                id="connectBtn"
                style="width:100%;margin-top:8px"
            >
                ورود به سرور
            </button>

            <div id="onlineStatus" class="status"></div>

        </div>

        <!-- ROOM -->

        <div id="roomStep" class="step">

            <div id="roomWelcome" class="subtitle"></div>

            <button
                id="createRoomBtn"
                style="width:100%;margin-bottom:10px"
            >
                ساخت اتاق جدید
            </button>

            <div style="color:#888;margin:12px">
                یا
            </div>

            <div class="field">
                <label>کد ۶ رقمی اتاق</label>

                <input
                    id="roomInput"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="123456"
                    autocomplete="off"
                >
            </div>

            <button
                id="joinRoomBtn"
                style="width:100%"
            >
                ورود به اتاق
            </button>

        </div>

        <!-- LOBBY -->

        <div id="lobbyStep" class="step">

            <div>
                کد اتاق:
            </div>

            <div
                id="roomCode"
                class="roomCode"
            ></div>

            <div
                id="roomPlayers"
                class="playersBox"
            ></div>

            <div
                id="hostHint"
                class="waiting"
            ></div>

            <button id="startGameBtn">
                شروع بازی
            </button>

            <button id="leaveRoomBtn">
                خروج از اتاق
            </button>

        </div>

    </div>

</div>

<!-- =========================
     GAME MENU
========================= -->

<div id="gameMenu">

    <div class="menuBox">

        <h2>منوی بازی</h2>

        <button id="resumeBtn">
            ادامه بازی
        </button>

        <button id="lobbyBtn">
            بازگشت به اتاق
        </button>

    </div>

</div>

<!-- =========================
     MOBILE CONTROLS
========================= -->

<div id="mobileControls">

    <button class="mobileBtn" id="btnLeft">◀</button>
    <button class="mobileBtn" id="btnRight">▶</button>
    <button class="mobileBtn" id="btnJump">▲</button>
    <button class="mobileBtn" id="btnShoot">●</button>
    <button class="mobileBtn" id="btnReload">R</button>
    <button class="mobileBtn" id="btnGrenade">G</button>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 1280;
let H = 720;

function resizeCanvas(){

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


/* =========================================================
   ONLINE
========================================================= */

const SERVER_URL =
    location.protocol === "https:"
        ? "wss://" + location.host
        : "ws://" + location.host;

const onlinePanel =
    document.getElementById("onlinePanel");

const nameStep =
    document.getElementById("nameStep");

const roomStep =
    document.getElementById("roomStep");

const lobbyStep =
    document.getElementById("lobbyStep");

const nameInput =
    document.getElementById("nameInput");

const connectBtn =
    document.getElementById("connectBtn");

const onlineStatus =
    document.getElementById("onlineStatus");

const roomWelcome =
    document.getElementById("roomWelcome");

const createRoomBtn =
    document.getElementById("createRoomBtn");

const roomInput =
    document.getElementById("roomInput");

const joinRoomBtn =
    document.getElementById("joinRoomBtn");

const roomCodeEl =
    document.getElementById("roomCode");

const roomPlayersEl =
    document.getElementById("roomPlayers");

const hostHint =
    document.getElementById("hostHint");

const startGameBtn =
    document.getElementById("startGameBtn");

const leaveRoomBtn =
    document.getElementById("leaveRoomBtn");

const onlineInfo =
    document.getElementById("onlineInfo");

let ws = null;

let online = false;

let myId = "";

let myName = "";

let roomCode = "";

let isHost = false;

let remotePlayers = {};

let remoteShots = [];


/* =========================================================
   ONLINE HELPERS
========================================================= */

function status(text){

    onlineStatus.textContent = text || "";
}

function sendNet(data){

    if (
        ws &&
        ws.readyState === WebSocket.OPEN
    ){
        ws.send(JSON.stringify(data));
    }
}

function updateOnlineInfo(){

    if (!online || !roomCode){

        onlineInfo.style.display = "none";
        return;
    }

    onlineInfo.style.display = "block";

    const players =
        Object.values(remotePlayers);

    const names =
        players.map(p => p.name);

    if (
        myName &&
        !names.includes(myName)
    ){
        names.unshift(myName);
    }

    onlineInfo.textContent =
        "اتاق " +
        roomCode +
        " • " +
        names.length +
        "/4 • " +
        names.join(" • ");
}


/* =========================================================
   SHOW STEPS
========================================================= */

function showNameStep(){

    nameStep.style.display = "block";
    roomStep.style.display = "none";
    lobbyStep.style.display = "none";
}

function showRoomStep(){

    nameStep.style.display = "none";
    roomStep.style.display = "block";
    lobbyStep.style.display = "none";

    roomWelcome.textContent =
        "سلام " +
        myName +
        "! یک اتاق بساز یا با کد ۶ رقمی وارد شو.";

    status("");
}

function showLobby(code, host){

    roomCode = code;
    isHost = !!host;

    nameStep.style.display = "none";
    roomStep.style.display = "none";
    lobbyStep.style.display = "block";

    roomCodeEl.textContent = code;

    startGameBtn.style.display =
        isHost ? "block" : "none";

    startGameBtn.disabled = false;
    startGameBtn.textContent = "شروع بازی";

    hostHint.textContent =
        isHost
            ? "شما میزبان هستید. وقتی بازیکنان آماده‌اند، روی «شروع بازی» بزنید."
            : "منتظر شروع بازی توسط میزبان باشید.";

    status("اتاق آماده است.");
}


/* =========================================================
   UPDATE LOBBY
========================================================= */

function updateLobby(players){

    const arr =
        Object.values(players || {});

    roomPlayersEl.innerHTML =
        arr.map(p => {

            let text = "👤 " + p.name;

            if (p.id === myId){
                text += " (شما)";
            }

            if (p.host){
                text += " ⭐ میزبان";
            }

            return text;

        }).join("<br>");

    if (!arr.length){
        roomPlayersEl.innerHTML =
            "هنوز بازیکنی وارد نشده است.";
    }

    updateOnlineInfo();
}


/* =========================================================
   CONNECT
========================================================= */

function connectOnline(){

    myName =
        nameInput.value
            .trim()
            .slice(0,16);

    if (myName.length < 2){

        status(
            "نام باید حداقل ۲ حرف باشد."
        );

        return;
    }

    if (
        location.protocol === "file:"
    ){

        status(
            "بازی باید از طریق سرور اجرا شود."
        );

        return;
    }

    status("در حال اتصال...");

    connectBtn.disabled = true;

    ws = new WebSocket(SERVER_URL);

    ws.onopen = () => {

        sendNet({
            type:"hello",
            name:myName
        });

    };

    ws.onmessage = event => {

        let m;

        try{
            m = JSON.parse(event.data);
        }
        catch{
            return;
        }

        /* =========================
           CONNECTED
        ========================= */

        if (m.type === "connected"){

            return;
        }

        /* =========================
           WELCOME
        ========================= */

        if (m.type === "welcome"){

            myId = m.id;

            online = true;

            onlinePanel.style.display =
                "flex";

            showRoomStep();

            return;
        }

        /* =========================
           ROOM CREATED
        ========================= */

        if (m.type === "room_created"){

            remotePlayers =
                m.players || {};

            showLobby(
                m.code,
                true
            );

            updateLobby(
                remotePlayers
            );

            return;
        }

        /* =========================
           ROOM JOINED
        ========================= */

        if (m.type === "room_joined"){

            remotePlayers =
                m.players || {};

            showLobby(
                m.code,
                !!m.host
            );

            updateLobby(
                remotePlayers
            );

            return;
        }

        /* =========================
           ROOM UPDATE
        ========================= */

        if (m.type === "room"){

            remotePlayers =
                m.players || {};

            isHost =
                m.host === myId;

            roomCode =
                m.code;

            if (m.started){

                onlinePanel.style.display =
                    "none";

            }else{

                onlinePanel.style.display =
                    "flex";

                showLobby(
                    m.code,
                    isHost
                );

                updateLobby(
                    remotePlayers
                );
            }

            return;
        }

        /* =========================
           START GAME
        ========================= */

        if (m.type === "start_game"){

            const gameStage =
                Math.max(
                    1,
                    Math.min(
                        5,
                        Number(m.stage) || 1
                    )
                );

            onlinePanel.style.display =
                "none";

            startGame(gameStage);

            return;
        }

        /* =========================
           STATE
        ========================= */

        if (m.type === "state"){

            if (m.id !== myId){

                remotePlayers[m.id] =
                    m.player;

            }

            return;
        }

        /* =========================
           SHOT
        ========================= */

        if (
            m.type === "shot" &&
            m.id !== myId
        ){

            remoteShots.push({
                ...m.shot,
                ttl:700
            });

            return;
        }

        /* =========================
           KILL
        ========================= */

        if (m.type === "kill"){

            const e =
                enemies[m.index];

            if (e){
                e.alive = false;
            }

            return;
        }

        /* =========================
           STAGE
        ========================= */

        if (m.type === "stage"){

            if (
                screen !== "game" ||
                stage !== m.stage
            ){

                startGame(
                    Math.max(
                        1,
                        Math.min(
                            5,
                            Number(m.stage) || 1
                        )
                    )
                );
            }

            return;
        }

        /* =========================
           ERROR
        ========================= */

        if (m.type === "error"){

            status(m.message);

            connectBtn.disabled = false;

            return;
        }

        /* =========================
           LEFT ROOM
        ========================= */

        if (m.type === "left_room"){

            roomCode = "";
            isHost = false;

            showRoomStep();

            return;
        }

    };

    ws.onclose = () => {

        online = false;

        roomCode = "";

        isHost = false;

        remotePlayers = {};

        connectBtn.disabled = false;

        onlinePanel.style.display =
            "flex";

        showNameStep();

        status(
            "اتصال قطع شد. دوباره وارد شو."
        );

        updateOnlineInfo();
    };

    ws.onerror = () => {

        status(
            "اتصال به سرور برقرار نشد."
        );

    };
}

connectBtn.onclick =
    connectOnline;

nameInput.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter"){
            connectOnline();
        }

    }
);


/* =========================================================
   ROOM BUTTONS
========================================================= */

createRoomBtn.onclick = () => {

    sendNet({
        type:"create_room"
    });

};

joinRoomBtn.onclick = () => {

    const code =
        roomInput.value
            .replace(/\D/g,"")
            .slice(0,6);

    if (code.length !== 6){

        status(
            "رمز اتاق باید دقیقاً ۶ رقم باشد."
        );

        return;
    }

    sendNet({
        type:"join_room",
        code
    });

};

roomInput.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter"){
            joinRoomBtn.click();
        }

    }
);


/* =========================================================
   START BUTTON
========================================================= */

startGameBtn.onclick = () => {

    if (!isHost) return;

    startGameBtn.disabled = true;

    startGameBtn.textContent =
        "در حال شروع...";

    sendNet({
        type:"start_game",
        stage:1
    });
};


/* =========================================================
   LEAVE ROOM
========================================================= */

leaveRoomBtn.onclick = () => {

    sendNet({
        type:"leave_room"
    });

    roomCode = "";

    isHost = false;

    remotePlayers = {};

    showRoomStep();

    status(
        "از اتاق خارج شدی."
    );

    updateOnlineInfo();
};


/* =========================================================
   GAME STATE
========================================================= */

let screen = "game";

let stage = 1;

let cameraX = 0;

let worldWidth = 6000;

let gameRunning = false;

let gameOver = false;

let lastTime = 0;

let netTimer = 0;

let messageTimer = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:120,
    y:420,

    w:42,
    h:72,

    vx:0,
    vy:0,

    speed:260,

    jump:600,

    dir:1,

    hp:100,

    gun:"Rifle",

    ammo:30,

    maxAmmo:30,

    reload:false,

    reloadTimer:0,

    grounded:false,

    shootCooldown:0,

    grenadeCooldown:0,

    invincible:0
};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if (
            [
                " ",
                "arrowleft",
                "arrowright",
                "arrowup",
                "arrowdown"
            ].includes(e.key.toLowerCase())
        ){
            e.preventDefault();
        }

        if (e.key.toLowerCase() === "r"){
            reload();
        }

        if (e.key.toLowerCase() === "q"){
            grenade();
        }

        if (e.key === "Escape"){
            toggleMenu();
        }

    }
);

window.addEventListener(
    "keyup",
    e => {
        keys[e.key.toLowerCase()] = false;
    }
);


/* =========================================================
   TOUCH CONTROLS
========================================================= */

function bindMobile(id, key){

    const el =
        document.getElementById(id);

    const down = e => {

        e.preventDefault();

        keys[key] = true;
    };

    const up = e => {

        e.preventDefault();

        keys[key] = false;
    };

    el.addEventListener(
        "pointerdown",
        down
    );

    el.addEventListener(
        "pointerup",
        up
    );

    el.addEventListener(
        "pointercancel",
        up
    );

    el.addEventListener(
        "pointerleave",
        up
    );
}

bindMobile("btnLeft","a");
bindMobile("btnRight","d");
bindMobile("btnJump","w");
bindMobile("btnShoot"," ");
bindMobile("btnReload","r");
bindMobile("btnGrenade","q");


/* =========================================================
   WORLD
========================================================= */

const solids = [];

function createWorld(){

    solids.length = 0;

    solids.push({
        x:0,
        y:560,
        w:worldWidth,
        h:200
    });

    for(
        let x=450;
        x<worldWidth-400;
        x+=520
    ){

        if (Math.random() > .35){

            solids.push({
                x,
                y:500,
                w:110,
                h:60
            });

        }
    }

    solids.push({
        x:1100,
        y:430,
        w:120,
        h:130
    });

    solids.push({
        x:2400,
        y:450,
        w:150,
        h:110
    });

    solids.push({
        x:3800,
        y:420,
        w:180,
        h:140
    });
}


/* =========================================================
   ENEMIES
========================================================= */

let enemies = [];

function createEnemies(){

    enemies = [];

    const count =
        8 + stage * 4;

    for(
        let i=0;
        i<count;
        i++
    ){

        const x =
            650 +
            i *
            ((worldWidth-1200) / count);

        enemies.push({

            x:x + Math.random()*120,

            y:488,

            w:42,

            h:72,

            vx:0,

            hp:
                40 +
                stage * 15,

            maxHp:
                40 +
                stage * 15,

            alive:true,

            dir:-1,

            cooldown:
                1 +
                Math.random()*2,

            type:
                i % 3

        });
    }
}


/* =========================================================
   BULLETS
========================================================= */

let bullets = [];

let grenades = [];


/* =========================================================
   COLLISION
========================================================= */

function overlap(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}


function moveAndCollide(ent,dt){

    ent.x += ent.vx * dt;

    for(const o of solids){

        if(overlap(ent,o)){

            if(ent.vx > 0){

                ent.x =
                    o.x - ent.w;

            }else if(ent.vx < 0){

                ent.x =
                    o.x + o.w;
            }

            ent.vx = 0;
        }
    }

    ent.y += ent.vy * dt;

    ent.grounded = false;

    for(const o of solids){

        if(overlap(ent,o)){

            if(ent.vy > 0){

                ent.y =
                    o.y - ent.h;

                ent.grounded = true;

            }else if(ent.vy < 0){

                ent.y =
                    o.y + o.h;
            }

            ent.vy = 0;
        }
    }
}


/* =========================================================
   START GAME
========================================================= */

function startGame(n=1){

    stage =
        Math.max(
            1,
            Math.min(5,Number(n)||1)
        );

    screen = "game";

    gameRunning = true;

    gameOver = false;

    cameraX = 0;

    player.x = 120;
    player.y = 400;

    player.vx = 0;
    player.vy = 0;

    player.hp = 100;

    player.ammo =
        player.maxAmmo;

    player.reload = false;

    player.invincible = 1;

    bullets = [];

    grenades = [];

    createWorld();

    createEnemies();

    onlinePanel.style.display =
        "none";

    updateHUD();

    showMessage(
        "STAGE " + stage,
        1500
    );
}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if (
        player.reload ||
        player.ammo >= player.maxAmmo
    ){
        return;
    }

    player.reload = true;

    player.reloadTimer = 1.2;
}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

    if (!gameRunning) return;

    if (player.reload) return;

    if (player.shootCooldown > 0) return;

    if (player.ammo <= 0){

        reload();

        return;
    }

    player.ammo--;

    player.shootCooldown =
        .16;

    const bx =
        player.dir > 0
            ? player.x + player.w
            : player.x - 10;

    const by =
        player.y + 28;

    const speed = 800;

    const bullet = {

        x:bx,

        y:by,

        vx:
            speed *
            player.dir,

        vy:0,

        r:4,

        damage:
            20 + stage * 3,

        life:1.5
    };

    bullets.push(bullet);

    netShot(bullet);
}


/* =========================================================
   GRENADE
========================================================= */

function grenade(){

    if (
        !gameRunning ||
        player.grenadeCooldown > 0
    ){
        return;
    }

    player.grenadeCooldown =
        1.5;

    grenades.push({

        x:
            player.x +
            player.w/2,

        y:
            player.y,

        vx:
            player.dir * 380,

        vy:
            -500,

        timer:1.2

    });
}


/* =========================================================
   ENEMY HIT
========================================================= */

function damageEnemy(enemy,index,damage){

    if (!enemy.alive) return;

    enemy.hp -= damage;

    if(enemy.hp <= 0){

        enemy.hp = 0;

        enemy.alive = false;

        sendNet({
            type:"kill",
            index,
            stage
        });
    }
}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

    if (
        player.invincible > 0 ||
        gameOver
    ){
        return;
    }

    player.hp -= amount;

    player.invincible = .5;

    if(player.hp <= 0){

        player.hp = 0;

        gameOver = true;

        showMessage(
            "YOU ARE DOWN",
            3000
        );
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if (!gameRunning) return;

    if(gameOver){

        if(keys["enter"]){
            startGame(stage);
        }

        return;
    }

    player.shootCooldown =
        Math.max(
            0,
            player.shootCooldown-dt
        );

    player.grenadeCooldown =
        Math.max(
            0,
            player.grenadeCooldown-dt
        );

    player.invincible =
        Math.max(
            0,
            player.invincible-dt
        );

    if(player.reload){

        player.reloadTimer -= dt;

        if(player.reloadTimer <= 0){

            player.reload = false;

            player.ammo =
                player.maxAmmo;
        }
    }

    /* MOVEMENT */

    player.vx = 0;

    if(keys["a"] || keys["arrowleft"]){

        player.vx =
            -player.speed;

        player.dir = -1;
    }

    if(keys["d"] || keys["arrowright"]){

        player.vx =
            player.speed;

        player.dir = 1;
    }

    if(
        (keys["w"] ||
         keys["arrowup"]) &&
        player.grounded
    ){

        player.vy =
            -player.jump;
    }

    /* SHOOT */

    if(keys[" "]){
        shoot();
    }

    /* GRAVITY */

    player.vy +=
        1500 * dt;

    moveAndCollide(
        player,
        dt
    );

    player.x =
        Math.max(
            0,
            Math.min(
                worldWidth-player.w,
                player.x
            )
        );

    /* BULLETS */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b = bullets[i];

        b.x += b.vx * dt;

        b.y += b.vy * dt;

        b.life -= dt;

        let remove = false;

        if(
            b.life <= 0 ||
            b.x < 0 ||
            b.x > worldWidth
        ){
            remove = true;
        }

        for(const s of solids){

            if(
                b.x > s.x &&
                b.x < s.x+s.w &&
                b.y > s.y &&
                b.y < s.y+s.h
            ){

                remove = true;
                break;
            }
        }

        if(!remove){

            for(
                let j=0;
                j<enemies.length;
                j++
            ){

                const e =
                    enemies[j];

                if(!e.alive) continue;

                const box = {
                    x:b.x-3,
                    y:b.y-3,
                    w:6,
                    h:6
                };

                if(
                    overlap(box,e)
                ){

                    damageEnemy(
                        e,
                        j,
                        b.damage
                    );

                    remove = true;

                    break;
                }
            }
        }

        if(remove){
            bullets.splice(i,1);
        }
    }

    /* GRENADES */

    for(
        let i=grenades.length-1;
        i>=0;
        i--
    ){

        const g =
            grenades[i];

        g.vy +=
            1200*dt;

        g.x +=
            g.vx*dt;

        g.y +=
            g.vy*dt;

        g.timer -= dt;

        if(g.y > 510){

            g.y = 510;

            g.vy *= -.35;

            g.vx *= .7;
        }

        if(g.timer <= 0){

            for(
                const e of enemies
            ){

                if(!e.alive) continue;

                const dx =
                    e.x-g.x;

                const dy =
                    e.y-g.y;

                const distance =
                    Math.sqrt(
                        dx*dx+dy*dy
                    );

                if(distance < 180){

                    damageEnemy(
                        e,
                        enemies.indexOf(e),
                        70
                    );
                }
            }

            grenades.splice(i,1);
        }
    }

    /* ENEMIES */

    for(
        let i=0;
        i<enemies.length;
        i++
    ){

        const e =
            enemies[i];

        if(!e.alive) continue;

        const dx =
            player.x-e.x;

        if(Math.abs(dx)>70){

            e.vx =
                dx>0
                    ? 55
                    : -55;

            e.dir =
                dx>0
                    ? 1
                    : -1;

            e.x +=
                e.vx*dt;
        }

        e.cooldown -= dt;

        if(
            Math.abs(dx)<500 &&
            e.cooldown<=0
        ){

            damagePlayer(
                4+stage
            );

            e.cooldown =
                1.5 +
                Math.random()*1.5;
        }
    }

    /* CAMERA */

    cameraX =
        player.x -
        W*.35;

    cameraX =
        Math.max(
            0,
            Math.min(
                worldWidth-W,
                cameraX
            )
        );

    /* NETWORK */

    netTimer += dt;

    if(
        online &&
        roomCode &&
        netTimer > .08
    ){

        netTimer = 0;

        netState();
    }

    for(
        const s of remoteShots
    ){
        s.ttl -= dt*1000;
    }

    remoteShots =
        remoteShots.filter(
            s => s.ttl > 0
        );

    updateHUD();

    checkStageEnd();
}


/* =========================================================
   STAGE END
========================================================= */

function checkStageEnd(){

    const alive =
        enemies.filter(
            e => e.alive
        ).length;

    if(alive === 0){

        if(stage < 5){

            if(isHost){

                stage++;

                sendNet({
                    type:"stage",
                    stage
                });

                startGame(stage);
            }

        }else{

            gameRunning = false;

            showMessage(
                "MISSION COMPLETE",
                5000
            );
        }
    }
}


/* =========================================================
   NETWORK STATE
========================================================= */

function netState(){

    if(
        !online ||
        !player ||
        !roomCode
    ){
        return;
    }

    sendNet({

        type:"state",

        player:{
            name:myName,

            x:player.x,

            y:player.y,

            dir:player.dir,

            hp:player.hp,

            gun:player.gun,

            stage,

            alive:!gameOver
        }

    });
}


function netShot(s){

    if(!online) return;

    sendNet({

        type:"shot",

        shot:{
            x:s.x,
            y:s.y,
            vx:s.vx,
            vy:s.vy,
            d:s.damage
        }

    });
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#252d25"
    );

    gradient.addColorStop(
        .55,
        "#66725d"
    );

    gradient.addColorStop(
        1,
        "#27271e"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /* clouds */

    ctx.fillStyle =
        "rgba(220,225,210,.10)";

    for(
        let i=0;
        i<8;
        i++
    ){

        const x =
            ((i*420-cameraX*.12)
            % (W+500))-250;

        const y =
            70+(i%3)*55;

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            100,
            25,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* distant trees */

    for(
        let x=-100;
        x<worldWidth;
        x+=170
    ){

        const sx =
            x-cameraX*.35;

        if(
            sx < -100 ||
            sx > W+100
        ){
            continue;
        }

        ctx.fillStyle =
            "#273427";

        ctx.fillRect(
            sx,
            390,
            12,
            170
        );

        ctx.beginPath();

        ctx.arc(
            sx+6,
            370,
            45,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* ground */

    ctx.fillStyle =
        "#51442f";

    ctx.fillRect(
        0,
        560,
        W,
        H-560
    );

    ctx.fillStyle =
        "#66543a";

    for(
        let x=0;
        x<W;
        x+=45
    ){

        ctx.fillRect(
            x,
            570+(x%3)*8,
            22,
            3
        );
    }
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    for(const s of solids){

        const x =
            s.x-cameraX;

        if(
            x+s.w<0 ||
            x>W
        ){
            continue;
        }

        ctx.fillStyle =
            "#3b3427";

        ctx.fillRect(
            x,
            s.y,
            s.w,
            s.h
        );

        ctx.strokeStyle =
            "#756044";

        ctx.strokeRect(
            x,
            s.y,
            s.w,
            s.h
        );

        /* boxes */

        if(
            s.w < 200 &&
            s.h < 150
        ){

            ctx.fillStyle =
                "#625036";

            ctx.fillRect(
                x+5,
                s.y+5,
                s.w-10,
                20
            );

            ctx.strokeStyle =
                "#947953";

            ctx.strokeRect(
                x+5,
                s.y+5,
                s.w-10,
                20
            );
        }
    }
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawCharacter(
    p,
    x,
    y,
    color="#667b4e",
    name=""
){

    ctx.save();

    ctx.translate(
        x+p.w/2,
        y
    );

    if(p.dir < 0){
        ctx.scale(-1,1);
    }

    /* legs */

    ctx.fillStyle =
        "#20231c";

    ctx.fillRect(
        -16,
        42,
        12,
        30
    );

    ctx.fillRect(
        5,
        42,
        12,
        30
    );

    /* body */

    ctx.fillStyle =
        color;

    ctx.fillRect(
        -20,
        17,
        40,
        34
    );

    /* backpack */

    ctx.fillStyle =
        "#343c2a";

    ctx.fillRect(
        -25,
        20,
        8,
        28
    );

    /* head */

    ctx.fillStyle =
        "#c89b73";

    ctx.beginPath();

    ctx.arc(
        0,
        9,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* helmet */

    ctx.fillStyle =
        "#303a27";

    ctx.beginPath();

    ctx.arc(
        0,
        5,
        17,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /* rifle */

    ctx.strokeStyle =
        "#171914";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
        5,
        28
    );

    ctx.lineTo(
        42,
        24
    );

    ctx.stroke();

    ctx.restore();

    if(name){

        ctx.save();

        ctx.font =
            "bold 13px Tahoma";

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "#fff";

        ctx.shadowColor =
            "#000";

        ctx.shadowBlur = 4;

        ctx.fillText(
            name,
            x+p.w/2,
            y-12
        );

        ctx.restore();
    }
}


/* =========================================================
   DRAW ENEMY
========================================================= */

function drawEnemy(e){

    if(!e.alive) return;

    const x =
        e.x-cameraX;

    if(
        x+e.w<0 ||
        x>W
    ){
        return;
    }

    ctx.save();

    ctx.translate(
        x+e.w/2,
        e.y
    );

    if(e.dir<0){
        ctx.scale(-1,1);
    }

    /* legs */

    ctx.fillStyle =
        "#22251e";

    ctx.fillRect(
        -15,
        43,
        11,
        29
    );

    ctx.fillRect(
        4,
        43,
        11,
        29
    );

    /* body */

    ctx.fillStyle =
        e.type===0
            ? "#4a5140"
            : "#3c4337";

    ctx.fillRect(
        -19,
        17,
        38,
        34
    );

    /* head */

    ctx.fillStyle =
        "#a77d5d";

    ctx.beginPath();

    ctx.arc(
        0,
        9,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* helmet */

    ctx.fillStyle =
        "#292d25";

    ctx.beginPath();

    ctx.arc(
        0,
        5,
        17,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /* weapon */

    ctx.strokeStyle =
        "#11130f";

    ctx.lineWidth = 6;

    ctx.beginPath();

    ctx.moveTo(
        5,
        28
    );

    ctx.lineTo(
        42,
        28
    );

    ctx.stroke();

    ctx.restore();

    /* HP */

    const hp =
        Math.max(
            0,
            e.hp/e.maxHp
        );

    ctx.fillStyle =
        "#211814";

    ctx.fillRect(
        x,
        e.y-10,
        e.w,
        5
    );

    ctx.fillStyle =
        "#ad704d";

    ctx.fillRect(
        x,
        e.y-10,
        e.w*hp,
        5
    );
}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullets(){

    ctx.fillStyle =
        "#f4dc8b";

    for(const b of bullets){

        const x =
            b.x-cameraX;

        if(
            x<0 ||
            x>W
        ){
            continue;
        }

        ctx.beginPath();

        ctx.arc(
            x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.fillStyle =
        "#d7b879";

    for(const b of remoteShots){

        const x =
            b.x-cameraX;

        ctx.beginPath();

        ctx.arc(
            x,
            b.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   DRAW GRENADES
========================================================= */

function drawGrenades(){

    for(const g of grenades){

        const x =
            g.x-cameraX;

        ctx.fillStyle =
            "#1d231a";

        ctx.beginPath();

        ctx.arc(
            x,
            g.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   DRAW REMOTE PLAYERS
========================================================= */

function drawRemotePlayers(){

    for(const id in remotePlayers){

        if(id === myId) continue;

        const p =
            remotePlayers[id];

        if(!p) continue;

        if(
            Number(p.stage) !== stage
        ){
            continue;
        }

        const rp = {

            x:Number(p.x)||0,

            y:Number(p.y)||0,

            w:42,

            h:72,

            dir:p.dir < 0 ? -1 : 1
        };

        drawCharacter(
            rp,
            rp.x-cameraX,
            rp.y,
            "#4e7180",
            p.name || "Player"
        );
    }
}


/* =========================================================
   DRAW GAME
========================================================= */

function drawGame(){

    drawBackground();

    drawWorld();

    for(
        const e of enemies
    ){
        drawEnemy(e);
    }

    drawGrenades();

    drawBullets();

    drawRemotePlayers();

    drawCharacter(
        player,
        player.x-cameraX,
        player.y,
        "#718b55",
        myName
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "hpText"
    ).textContent =
        Math.round(player.hp);

    document.getElementById(
        "hpFill"
    ).style.width =
        player.hp+"%";

    document.getElementById(
        "stageText"
    ).textContent =
        stage;

    document.getElementById(
        "weaponText"
    ).textContent =
        player.reload
            ? "Reloading..."
            : player.gun +
              " " +
              player.ammo +
              "/" +
              player.maxAmmo;

    document.getElementById(
        "enemyText"
    ).textContent =
        enemies.filter(
            e=>e.alive
        ).length;
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    duration=1500
){

    const el =
        document.getElementById(
            "gameMessage"
        );

    el.textContent =
        text;

    el.style.opacity = "1";

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            ()=>{
                el.style.opacity="0";
            },
            duration
        );
}

   MENU

    document.getElementById(

    );

document.getElementById(

    ){

        });

    if(
        !gameRunning ||
        gameOver
    ){
        return;
    }

    if(
        gameMenu.style.display ===
        "flex"
    ){

        gameMenu.style.display =
            "none";

    }else{

        gameMenu.style.display =
            "flex";
    }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(time){

    if(!lastTime){
        lastTime = time;
    }

    let dt =
        (time-lastTime)/1000;

    lastTime = time;

    dt =
        Math.min(
            dt,
            .033
        );

    update(dt);

    if(gameRunning){
        drawGame();
    }else{
        drawBackground();
    }

    requestAnimationFrame(loop);
}


/* =========================================================
   INITIAL SCREEN
========================================================= */

onlinePanel.style.display =
    "flex";

showNameStep();

requestAnimationFrame(loop);

</script>
