<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WWII Pixel Assault</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Tahoma,Arial}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);image-rendering:pixelated;background:#6aa0b2;touch-action:none}
#touch{display:none;position:fixed;left:0;right:0;bottom:8px;height:130px;pointer-events:none}
.t{position:absolute;width:58px;height:58px;border:2px solid #fff6;border-radius:12px;background:#111b;color:#fff;font:bold 24px Tahoma;display:flex;align-items:center;justify-content:center;pointer-events:auto}
@media(max-width:800px){#touch{display:block}}
#L{left:12px;bottom:10px}#R{left:78px;bottom:10px}#J{left:144px;bottom:10px}
#F{right:12px;bottom:60px}#REL{right:78px;bottom:60px}#G{right:144px;bottom:60px}#P{right:12px;bottom:0}
#onlinePanel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:20}
#onlineBox{width:min(92vw,520px);padding:28px;background:#1d241d;border:3px solid #69785d;box-shadow:0 0 35px #000;text-align:center;color:#fff}
#onlineBox h2{margin:0 0 14px;font-size:30px;color:#ead8ad}#nameInput{width:90%;padding:14px;font-size:20px;text-align:center;border:2px solid #69785d;background:#101510;color:#fff}#joinBtn{margin-top:14px;padding:13px 30px;font-size:19px;font-weight:bold;background:#59674f;color:#fff;border:0;cursor:pointer}#onlineStatus{margin-top:12px;color:#ddd;min-height:24px}#roomStep button,#lobbyStep button{margin-top:10px;padding:12px 24px;font-size:18px;font-weight:bold;background:#59674f;color:#fff;border:0;cursor:pointer}#leaveRoomBtn{background:#68443d!important}#roomInput{width:90%;padding:14px;font-size:22px;text-align:center;letter-spacing:5px;border:2px solid #69785d;background:#101510;color:#fff}
#onlineInfo{position:fixed;top:8px;right:10px;z-index:8;color:#fff;background:#111b;padding:6px 10px;border:1px solid #ffffff33;font:14px Tahoma;display:none}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="onlineInfo"></div>
<div id="onlinePanel"><div id="onlineBox"><h2>WWII PIXEL ASSAULT — آنلاین</h2>
<div id="nameStep"><div>اول یک نام منحصر‌به‌فرد انتخاب کن.</div><br><input id="nameInput" maxlength="16" autocomplete="off" placeholder="نام بازیکن"><br><button id="joinBtn">ورود به سرور</button></div>
<div id="roomStep" style="display:none"><div id="roomWelcome" style="color:#ead8ad;font-size:20px;margin-bottom:15px"></div><button id="createRoomBtn">ساخت اتاق جدید</button><div style="margin:14px 0;color:#aaa">یا</div><input id="roomInput" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="رمز ۶ رقمی اتاق"><br><button id="joinRoomBtn">ورود به اتاق</button></div>
<div id="lobbyStep" style="display:none"><div style="font-size:18px">کد اتاق شما:</div><div id="roomCode" style="font-size:42px;letter-spacing:8px;color:#ffe19b;margin:10px"></div><div id="roomPlayers" style="margin:12px 0;line-height:1.9"></div><div id="hostHint" style="color:#aaa;font-size:14px"></div><button id="leaveRoomBtn">خروج از اتاق</button></div>
<div id="onlineStatus">در حال آماده‌سازی...</div></div></div>
<div id="touch">
<div class="t" id="L">◀</div><div class="t" id="R">▶</div><div class="t" id="J">▲</div>
<div class="t" id="F">🔫</div><div class="t" id="REL">R</div><div class="t" id="G">💣</div><div class="t" id="P">E</div>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");ctx.imageSmoothingEnabled=false;
const W=1280,H=720,keys={};let screen="menu",stage=1,cam=0,last=0,buttons=[],player,enemies=[],shots=[],grenades=[],drops=[],fx=[],obstacles=[],medkits=[],battlefield=[],smoke=[],msg="",msgT=0;
// online state is declared in the online-room section below
const SD=[
{name:"ساحل نورماندی",len:6200,n:18,hp:45,sky:"#69a7bb"},
{name:"روستای متروکه",len:7300,n:26,hp:58,sky:"#84949a"},
{name:"جنگل فرانسه",len:8500,n:35,hp:70,sky:"#66876c"},
{name:"خط مقدم آلمان",len:10100,n:46,hp:84,sky:"#727570"},
{name:"قلعه نهایی",len:12200,n:60,hp:102,sky:"#555f65"}];
const G={
pistol:{name:"M1911",d:20,rate:290,mag:7,reload:850,speed:15,p:1,s:.015},
smg:{name:"Thompson",d:13,rate:105,mag:30,reload:1100,speed:15,p:1,s:.045},
rifle:{name:"M1 Garand",d:34,rate:470,mag:8,reload:1050,speed:17,p:1,s:.01},
mg:{name:"Browning M1919",d:10,rate:75,mag:50,reload:1500,speed:15,p:1,s:.07},
shotgun:{name:"Combat Shotgun",d:11,rate:640,mag:5,reload:1250,speed:13,p:7,s:.20}};
const R=(a,b)=>Math.random()*(b-a)+a;
const T=w=>566+Math.sin(w*.004)*10+Math.sin(w*.014)*7;
function box(a,b,w,h,col){ctx.fillStyle=col;ctx.fillRect(a|0,b|0,w|0,h|0)}
function text(s,a,b,z=20,col="#fff",al="center"){ctx.fillStyle=col;ctx.font="bold "+z+"px Tahoma";ctx.textAlign=al;ctx.fillText(s,a,b)}
function say(s,t=1200){msg=s;msgT=t}
function button(a,b,w,h,label,id){buttons.push({a,b,w,h,id});box(a,b,w,h,"#202821");box(a+4,b+4,w-8,h-8,"#59674f");text(label,a+w/2,b+h/2+8,24)}
function startGame(n){
stage=n;screen="game";cam=0;shots=[];grenades=[];drops=[];fx=[];smoke=[];obstacles=[];medkits=[];battlefield=[];
const d=SD[n-1];
player={x:120,y:T(120)-62,w:34,h:62,vx:0,vy:0,dir:1,hp:100,max:100,ground:false,crouch:false,gun:"pistol",ammo:7,reload:0,last:0,grenades:4,kills:0,anim:0};

const obstacleCount=10+n*3;
for(let i=0;i<obstacleCount;i++){
  let ox=700+i*(d.len-1050)/obstacleCount+R(-90,90),type=i%4;
  let ow=type===3?120:R(55,95),oh=type===1?42:type===3?48:55;
  obstacles.push({x:ox,y:T(ox)-oh,w:ow,h:oh,type});
}
for(let i=0;i<Math.floor(d.len/520);i++){
  let x=350+i*520+R(-110,120);
  battlefield.push({x,type:i%7});
}
for(let i=0;i<Math.floor(d.len/900);i++){
  let x=900+i*900+R(-180,180);
  smoke.push({x,y:T(x)-70,r:R(14,28),t:R(0,800)});
}
const medkitCount=3;
for(let i=0;i<medkitCount;i++){
  let mx=1100+i*(d.len-1700)/(medkitCount-1)+R(-100,100);
  medkits.push({x:mx,y:T(mx)-28,w:42,h:28,used:false});
}
enemies=[];
for(let i=0;i<d.n;i++){
  let w=520+i*(d.len-950)/d.n+R(-55,90);
  let type=n>=3&&i%8==0?"elite":n>=2&&i%5==0?"mg":"rifle",hp=d.hp+(type=="elite"?45:0);
  let ey=T(w)-58,test={x:w,y:ey,w:32,h:58};
  for(const o of obstacles){if(rectsOverlap(test,o)){w=o.x+o.w+55;ey=T(w)-58;test={x:w,y:ey,w:32,h:58};}}
  enemies.push({x:w,y:ey,w:32,h:58,hp,max:hp,type,dir:-1,cool:R(850,1800),alive:true,anim:R(0,6)});
}
say("مرحله "+n+" — "+d.name,1800)
}
function shoot(){if(screen!="game"||player.reload>0)return;let g=G[player.gun],now=performance.now();if(now-player.last<g.rate)return;if(player.ammo<=0){say("خشاب خالی — R",800);return}player.last=now;player.ammo--;for(let i=0;i<g.p;i++){let sp=(Math.random()-.5)*g.s;const ns={x:player.x+player.dir*28,y:player.y+24,vx:Math.cos(sp)*g.speed*player.dir,vy:Math.sin(sp)*g.speed,d:g.d,enemy:false};shots.push(ns);netShot(ns)}}
function reload(){if(screen=="game"&&player.reload<=0&&player.ammo<G[player.gun].mag)player.reload=G[player.gun].reload}
function grenade(){if(screen!="game"||player.grenades<=0)return;player.grenades--;grenades.push({x:player.x+player.dir*20,y:player.y+20,vx:player.dir*8,vy:-9,t:1350})}
function healPlayer(){
  for(const m of medkits){
    if(m.used) continue;
    if(Math.abs(m.x-player.x)<65){
      if(player.hp>=player.max){say("جان کامل است",700);return}
      const before=player.hp;
      player.hp=Math.min(player.max,player.hp+player.max*0.5);
      m.used=true;
      say("جعبه پزشکی: +"+Math.ceil(player.hp-before)+" HP",1000);
      return;
    }
  }
  say("به جعبه پزشکی نزدیک شوید",700);
}
function pickup(){let b=null,bd=75;for(const d of drops){let q=Math.abs(d.x-player.x);if(q<bd){b=d;bd=q}}if(b){player.gun=b.gun;player.ammo=G[b.gun].mag;drops=drops.filter(v=>v!==b);say(G[b.gun].name+" برداشته شد",1000)}}
function fxadd(w,y,col="#e8a33a",n=8){for(let i=0;i<n;i++)fx.push({x:w,y,vx:R(-2,2),vy:R(-3,1),t:R(150,400),col})}
function hurt(e,d){e.hp-=d;fxadd(e.x,e.y+20,"#d8c59b",4);if(e.hp<=0){e.alive=false;let ei=enemies.indexOf(e);if(online&&ei>=0)sendNet({type:"kill",index:ei,stage});player.kills++;fxadd(e.x,e.y+25,"#b53c2d",9);if(Math.random()<.72)drops.push({x:e.x,y:T(e.x)-15,gun:["smg","rifle","mg","shotgun"][Math.floor(Math.random()*4)]})}}
function rectsOverlap(a,b){
return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function blocked(nx,ny,w,h){
return obstacles.some(o=>rectsOverlap({x:nx,y:ny,w,h},o))}
function bulletBlocked(s){
return obstacles.some(o=>s.x>=o.x&&s.x<=o.x+o.w&&s.y>=o.y&&s.y<=o.y+o.h)}
function moveX(dx){
if(!dx)return;
if(!blocked(player.x+dx,player.y,player.w,player.h))player.x+=dx;
}
function update(dt){
if(screen!="game")return;player.anim+=dt/90;if(player.reload>0){player.reload-=dt;if(player.reload<=0){player.reload=0;player.ammo=G[player.gun].mag}}
player.crouch=!!keys.s;
player.vx=(keys.d?3.7:0)-(keys.a?3.7:0);
if(player.vx)player.dir=player.vx>0?1:-1;
if(keys.w&&player.ground){player.vy=-10;player.ground=false}
moveX(player.vx);
player.vy+=.45;
player.y+=player.vy;
let gy=T(player.x);
if(player.y+player.h>=gy){player.y=gy-player.h;player.vy=0;player.ground=true}else player.ground=false;
for(const o of obstacles){
 if(rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h},o)&&player.vy>=0){
   player.y=o.y-player.h;player.vy=0;player.ground=true;
 }
}
let len=SD[stage-1].len;player.x=Math.max(25,Math.min(len,player.x));cam=Math.max(0,Math.min(player.x-380,len-W));
if(keys[" "])shoot();
for(const e of enemies)if(e.alive){let dist=player.x-e.x;e.anim+=dt/100;if(Math.abs(dist)<650){e.dir=dist>0?1:-1;if(Math.abs(dist)>150){
 const step=e.dir*(.28+stage*.045),test={x:e.x+step,y:e.y,w:e.w,h:e.h};
 if(!obstacles.some(o=>rectsOverlap(test,o)))e.x+=step;
}
e.cool-=dt;if(e.cool<=0){e.cool=R(950,1700-stage*35);let w=e.type=="mg"?G.mg:G.rifle;shots.push({x:e.x+e.dir*20,y:e.y+23,vx:e.dir*w.speed*.68,vy:0,d:Math.max(3,w.d*.45+stage*.5),enemy:true})}}}
for(const s of shots){
 s.x+=s.vx;s.y+=s.vy;s.travel=(s.travel||0)+Math.hypot(s.vx,s.vy);
 if(bulletBlocked(s)){fxadd(s.x,s.y,"#d7c39a",4);s.dead=true}
}
for(const s of shots)if(!s.dead&&s.enemy&&Math.abs(s.x-player.x)<28&&Math.abs(s.y-(player.y+25))<40){
 player.hp-=s.d;s.dead=true;fxadd(player.x,player.y,"#c63",5)
}
for(const s of shots)if(!s.dead&&!s.enemy)for(const e of enemies)if(e.alive&&Math.abs(s.x-e.x)<27&&Math.abs(s.y-(e.y+25))<38){
 hurt(e,s.d);s.dead=true;break
}
shots=shots.filter(s=>!s.dead&&(s.travel||0)<520&&s.x>-200&&s.x<len+200);
for(const s of remoteShots){s.x+=s.vx;s.y+=s.vy;s.ttl-=dt}remoteShots=remoteShots.filter(s=>s.ttl>0);
for(const g of grenades){
 const nx=g.x+g.vx,ny=g.y+g.vy,hit=obstacles.some(o=>nx>=o.x-4&&nx<=o.x+o.w+4&&ny>=o.y-4&&ny<=o.y+o.h+4);
 if(hit){g.vx*=-.45;g.vy*=-.45}else{g.x=nx;g.vy+=.35;g.y+=g.vy}
 g.t-=dt;
 if(g.y>T(g.x)-8){g.y=T(g.x)-8;g.vy*=-.45;g.vx*=.72}
}
for(const g of grenades)if(g.t<=0){for(const e of enemies)if(e.alive&&Math.abs(e.x-g.x)<145)hurt(e,80);fxadd(g.x,g.y,"#e8a33a",18);g.t=-999}
grenades=grenades.filter(g=>g.t>-900);for(const f of fx){f.x+=f.vx;f.y+=f.vy;f.vy+=.06;f.t-=dt}
for(const s of smoke){s.t+=dt;if(s.t>2600){s.t=0;s.y=T(s.x)-70;s.r=R(14,28)}}fx=fx.filter(f=>f.t>0);if(msgT>0)msgT-=dt;
if(player.hp<=0){screen="dead";return}if(enemies.every(e=>!e.alive)&&player.x>=len-500)screen="win"}
function sky(){
  box(0,0,W,H,SD[stage-1].sky);
  /* clouds */
  for(let i=0;i<11;i++){
    let a=i*170-(cam*.08%170),b=70+(i%4)*38;
    box(a,b,100,13,"#d5d8d1");box(a+22,b-9,58,22,"#d5d8d1");
  }
  /* distant smoke columns */
  ctx.globalAlpha=.18;
  for(let i=0;i<7;i++){
    let a=i*270-(cam*.16%270);
    box(a,205-(i%3)*30,18,155,"#4e5651");
    box(a-12,185-(i%3)*30,42,25,"#59605a");
  }
  ctx.globalAlpha=1;
}
function decor(){for(let i=0;i<45;i++){let w=i*280+120,a=w-cam;if(a<-100||a>W+100)continue;let gy=T(w);box(a,gy-90,10,90,"#493d2f");box(a-18,gy-68,46,8,"#59472e");if(i%3==0){box(a+25,gy-35,35,35,"#4d5147")}}}
function ground(){box(0,566,W,154,"#715d40");for(let a=0;a<W;a+=9){let gy=T(a+cam);box(a,gy-4,3,6,"#334b31")}}
function soldier(px,py,dir,enemy,elite,an){ctx.save();ctx.translate(px,py);ctx.scale(dir,1);let l=(Math.sin(an)*2)|0;box(-21,59,44,5,"#3b3229");box(-15,52+l,13,9,"#25231e");box(6,52-l,13,9,"#25231e");box(-14,34,13,21,"#3d5140");box(4,34,13,21,"#465943");box(-16,10,32,29,elite?"#35463e":enemy?"#555448":"#465b47");box(-21,17,6,19,"#394437");box(10,16,8,22,"#9a715b");box(14,27,22,6,"#394338");box(-10,-9,20,21,enemy?"#9d725b":"#b27f61");box(-15,-14,30,7,elite?"#2d3835":enemy?"#4b4e46":"#43523f");box(-8,-20,18,7,elite?"#34433e":"#4e5b46");box(4,-2,3,3,"#28211d");box(8,5,5,2,"#34241e");/* تفنگ پیکسلی با فرم مشخص‌تر */
let gunColor=enemy?"#252621":"#222522";
let wood=enemy?"#5b4936":"#76543a";
if(player && !enemy && player.gun==="shotgun"){
  box(18,25,38,6,gunColor);box(52,24,13,7,gunColor);box(20,31,19,4,wood);box(15,29,8,8,wood);
}else if(player && !enemy && player.gun==="rifle"){
  box(17,24,44,5,gunColor);box(57,23,13,6,gunColor);box(18,29,23,5,wood);box(14,28,8,7,wood);box(42,23,7,5,"#4b4d47");
}else if(player && !enemy && player.gun==="mg"){
  box(17,23,48,7,gunColor);box(61,22,13,8,gunColor);box(19,30,21,5,wood);box(42,30,8,12,gunColor);box(27,35,6,10,gunColor);
}else if(player && !enemy && player.gun==="smg"){
  box(18,25,34,7,gunColor);box(49,24,14,8,gunColor);box(19,32,15,7,wood);box(30,34,6,12,gunColor);box(44,29,8,4,"#4c4f49");
}else{
  box(19,27,37,5,gunColor);box(51,26,11,7,gunColor);box(22,32,17,5,wood);
}
ctx.restore()}
function drawObstacles(){
for(const o of obstacles){
 const a=o.x-cam;if(a+o.w<-20||a>W+20)continue;
 if(o.type===0){box(a,o.y,o.w,o.h,"#5b5140");box(a+5,o.y+5,o.w-10,7,"#75684e");box(a+12,o.y+18,o.w-24,7,"#473f33")}
 else if(o.type===1){box(a,o.y,o.w,o.h,"#8b7450");box(a+8,o.y+7,o.w-16,7,"#b39463");box(a+8,o.y+22,o.w-16,7,"#69563e")}
 else if(o.type===2){box(a,o.y,o.w,o.h,"#4e514a");box(a+6,o.y+5,o.w-12,9,"#676960");box(a+14,o.y+22,18,7,"#3d403b")}
 else{box(a,o.y,o.w,o.h,"#554b3d");for(let k=0;k<4;k++){box(a+8+k*27,o.y+8,22,17,"#817052");box(a+2+k*29,o.y+27,25,17,"#6d5b43")}}
}}
function drawMedkits(){
for(const m of medkits){
 if(m.used)continue;
 const a=m.x-cam,g=T(m.x);
 box(a-23,g-29,46,29,"#33352f");
 box(a-20,g-27,40,25,"#d7d7c8");
 box(a-6,g-23,12,17,"#a83232");
 box(a-11,g-18,22,7,"#a83232");
 text("E",a,g-37,12,"#fff");
}}
function drawBattlefield(){
  /* distant ruined city */
  for(const b of battlefield){
    const x=b.x-cam*.55;
    if(x<-180||x>W+180)continue;
    const base=455;
    if(b.type===0){
      box(x,base-95,75,95,"#4a4841");box(x+8,base-110,56,18,"#5b574c");
      box(x+18,base-78,14,20,"#252725");box(x+45,base-58,13,24,"#282a27");
      box(x-8,base-8,95,9,"#393a35");
    }else if(b.type===1){
      box(x,base-70,95,70,"#55534a");box(x+10,base-92,74,22,"#686359");
      box(x+15,base-51,22,24,"#242522");box(x+57,base-51,22,24,"#292a27");
    }else if(b.type===2){
      box(x+35,base-125,13,125,"#4d5148");box(x+17,base-106,50,10,"#3e413a");
      box(x+24,base-87,36,8,"#55584f");box(x+38,base-142,8,17,"#393b35");
    }else if(b.type===3){
      box(x,base-45,115,45,"#5c5040");box(x+10,base-56,90,12,"#766248");
      for(let q=0;q<4;q++)box(x+16+q*22,base-38,13,7,"#382f27");
    }else if(b.type===4){
      box(x,base-9,105,6,"#302d27");box(x+12,base-35,4,35,"#36342f");box(x+75,base-35,4,35,"#36342f");
      for(let q=0;q<5;q++)box(x+15+q*16,base-28,2,2,"#8c8877");
    }else if(b.type===5){
      box(x+30,base-110,10,110,"#4a4135");box(x+3,base-82,65,7,"#5b4a36");
      box(x+16,base-61,48,7,"#594835");box(x+43,base-125,5,18,"#3b352d");
    }else{
      /* wrecked vehicle silhouette */
      box(x,base-27,120,27,"#303733");box(x+18,base-43,72,17,"#3a403b");
      box(x+8,base-3,24,18,"#222624");box(x+87,base-3,24,18,"#222624");
      box(x+44,base-55,36,14,"#3d433e");box(x+58,base-72,10,18,"#262a27");
    }
  }
  /* shell craters */
  for(let i=0;i<14;i++){
    let x=i*430+180-cam;
    box(x,559,45,7,"#463b2e");box(x+7,556,31,3,"#332d26");

/* ===== حالت آنلاین ۴ نفره + اتاق ۶ رقمی ===== */
const SERVER_URL=(location.protocol==="file:")?"":((location.protocol==="https:")?"wss://":"ws://")+location.host;
const onlinePanel=document.getElementById("onlinePanel"),nameInput=document.getElementById("nameInput"),joinBtn=document.getElementById("joinBtn"),onlineStatus=document.getElementById("onlineStatus"),onlineInfo=document.getElementById("onlineInfo");
const nameStep=document.getElementById("nameStep"),roomStep=document.getElementById("roomStep"),lobbyStep=document.getElementById("lobbyStep"),roomWelcome=document.getElementById("roomWelcome"),createRoomBtn=document.getElementById("createRoomBtn"),roomInput=document.getElementById("roomInput"),joinRoomBtn=document.getElementById("joinRoomBtn"),roomCodeEl=document.getElementById("roomCode"),roomPlayersEl=document.getElementById("roomPlayers"),hostHint=document.getElementById("hostHint"),leaveRoomBtn=document.getElementById("leaveRoomBtn");
let myName="",myId="",online=false,ws=null,remotePlayers={},remoteShots=[],roomCount=0,serverReady=false,netTimer=0,roomCode="",isHost=false;
function setOnlineStatus(t){onlineStatus.textContent=t}
function updateOnlineInfo(){if(!online||!roomCode){onlineInfo.style.display="none";return}onlineInfo.style.display="block";const names=Object.values(remotePlayers).map(p=>p.name);if(myName&&!names.includes(myName))names.unshift(myName);onlineInfo.textContent="اتاق "+roomCode+" • "+names.length+"/4 — "+names.join(" • ")}
function updateLobby(players){const arr=Object.values(players||{});roomPlayersEl.innerHTML=arr.map(p=>"👤 "+p.name+(p.id===myId?" (شما)":"")+(p.host?" ⭐ میزبان":"")).join("<br>");hostHint.textContent=isHost?"شما میزبان هستید. از منوی مراحل، مرحله را انتخاب کنید تا بازی شروع شود.":"منتظر انتخاب مرحله توسط میزبان باشید.";updateOnlineInfo()}
function sendNet(o){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}
function showRoomStep(){nameStep.style.display="none";roomStep.style.display="block";lobbyStep.style.display="none";roomWelcome.textContent="سلام "+myName+"! یک اتاق بساز یا با رمز ۶ رقمی وارد شو.";setOnlineStatus("")}
function showLobby(code,host){roomCode=code;isHost=!!host;roomStep.style.display="none";lobbyStep.style.display="block";roomCodeEl.textContent=code;setOnlineStatus("اتاق آماده است.")}
function connectOnline(){myName=nameInput.value.trim();if(myName.length<2){setOnlineStatus("نام باید حداقل ۲ حرف باشد.");return}if(SERVER_URL===""){setOnlineStatus("این فایل باید از طریق سرور آنلاین اجرا شود، نه با دوبارکلیک.");return}setOnlineStatus("در حال اتصال...");joinBtn.disabled=true;ws=new WebSocket(SERVER_URL);ws.onopen=()=>sendNet({type:"hello",name:myName});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
if(m.type==="welcome"){myId=m.id;online=true;serverReady=true;showRoomStep()}
else if(m.type==="room_created"){showLobby(m.code,true);remotePlayers=m.players||{};updateLobby(remotePlayers)}
else if(m.type==="room_joined"){showLobby(m.code,!!m.host);remotePlayers=m.players||{};updateLobby(remotePlayers)}
else if(m.type==="room"){roomCode=m.code;isHost=m.host===myId;remotePlayers=m.players||{};showLobby(m.code,isHost);updateLobby(remotePlayers)}
else if(m.type==="error"){setOnlineStatus(m.message);joinBtn.disabled=false}
else if(m.type==="state"){if(m.id!==myId)remotePlayers[m.id]=m.player}
else if(m.type==="shot"&&m.id!==myId){remoteShots.push({...m.shot,ttl:650})}
else if(m.type==="kill"&&enemies[m.index]){enemies[m.index].alive=false}
else if(m.type==="stage"){if(screen!=="game"||stage!==m.stage)startGame(m.stage)}
};ws.onclose=()=>{online=false;serverReady=false;roomCode="";setOnlineStatus("اتصال قطع شد. دوباره وارد شو.");joinBtn.disabled=false;onlinePanel.style.display="flex";nameStep.style.display="block";roomStep.style.display="none";lobbyStep.style.display="none";updateOnlineInfo()};ws.onerror=()=>setOnlineStatus("اتصال به سرور برقرار نشد.")}
joinBtn.onclick=connectOnline;nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")connectOnline()});
createRoomBtn.onclick=()=>sendNet({type:"create_room"});joinRoomBtn.onclick=()=>{let code=roomInput.value.replace(/\D/g,"").slice(0,6);if(code.length!==6){setOnlineStatus("رمز اتاق باید دقیقاً ۶ رقم باشد.");return}sendNet({type:"join_room",code})};roomInput.addEventListener("keydown",e=>{if(e.key==="Enter")joinRoomBtn.click()});
leaveRoomBtn.onclick=()=>{sendNet({type:"leave_room"});roomCode="";isHost=false;roomStep.style.display="block";lobbyStep.style.display="none";setOnlineStatus("از اتاق خارج شدی.");updateOnlineInfo()};
function netState(){if(!online||!player||!roomCode)return;sendNet({type:"state",player:{name:myName,x:player.x,y:player.y,dir:player.dir,hp:player.hp,gun:player.gun,stage}})}
function netShot(s){if(online)sendNet({type:"shot",shot:{x:s.x,y:s.y,vx:s.vx,vy:s.vy,d:s.d,enemy:false,ttl:650}})}

/* ===== کنترل کامل کیبورد کامپیوتر =====
   از e.code استفاده می‌کنیم تا حتی با کیبورد فارسی هم
   کلید فیزیکی W/A/S/D درست کار کند. */
window.addEventListener("keydown", e => {
  const code = e.code;

  const map = {
    KeyW: "w",
    KeyA: "a",
    KeyS: "s",
    KeyD: "d",
    ArrowUp: "w",
    ArrowDown: "s",
    ArrowLeft: "a",
    ArrowRight: "d",
    Space: " ",
    KeyR: "r",
    KeyE: "e",
    KeyQ: "q",
    KeyP: "p",
    Escape: "escape"
  };

  const gameKey = map[code];
  if (!gameKey) return;

  e.preventDefault();
  keys[gameKey] = true;

  /* کلیدهای تک‌فشاری فقط یک بار اجرا شوند */
  if (e.repeat) return;

  if (gameKey === "r") reload();

  if (gameKey === "e") {
    healPlayer();
    pickup();
  }

  if (gameKey === "q") grenade();

  if (gameKey === "p") {
    if (screen === "game") screen = "pause";
    else if (screen === "pause") screen = "game";
  }

  if (gameKey === "escape") screen = "menu";
});

window.addEventListener("keyup", e => {
  const map = {
    KeyW: "w",
    KeyA: "a",
    KeyS: "s",
    KeyD: "d",
    ArrowUp: "w",
    ArrowDown: "s",
    ArrowLeft: "a",
    ArrowRight: "d",
    Space: " ",
    KeyR: "r",
    KeyE: "e",
    KeyQ: "q",
    KeyP: "p"
  };

  const gameKey = map[e.code];
  if (gameKey) {
    e.preventDefault();
    keys[gameKey] = false;
  }
});

window.addEventListener("blur", () => {
  Object.keys(keys).forEach(k => keys[k] = false);
});
c.addEventListener("click",e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;for(let i=buttons.length-1;i>=0;i--){let b=buttons[i];if(px>=b.a&&px<=b.a+b.w&&py>=b.b&&py<=b.b+b.h){activate(b.id);return}}});
hold=(id,k)=>{let e=document.getElementById(id);e.onpointerdown=q=>{q.preventDefault();keys[k]=true};e.onpointerup=e.onpointercancel=e.onpointerleave=()=>keys[k]=false};
hold("L","a");hold("R","d");hold("J","w");hold("F"," ");hold("P","s");document.getElementById("P").onpointerdown=e=>{e.preventDefault();healPlayer();pickup()};
document.getElementById("REL").onpointerdown=e=>{e.preventDefault();reload()};
document.getElementById("G").onpointerdown=e=>{e.preventDefault();grenade()};
</script>
